name: CI/CD

# rebyld is a hand-written, build-free static PWA (no bundler, no
# package.json). There is nothing to "build" here — this pipeline exists
# to catch markup/manifest/script mistakes before they reach main, and to
# publish the repo root straight to GitHub Pages once they land there.
# See .github/README.md for the full rationale.

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Test (container)
    # Runs on: push to develop, push to main (so `deploy` below has a
    # same-run `test` job to depend on — see .github/README.md for why
    # this differs slightly from "push to develop only"), and every
    # pull_request regardless of base branch.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    container:
      image: node:20-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run checks
        run: bash .github/scripts/run-checks.sh

  pr-summary:
    name: PR checks + comment
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    container:
      image: node:20-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run checks
        id: checks
        run: bash .github/scripts/run-checks.sh

      - name: Post results as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '_No ci-summary.md was produced._';
            try {
              body = fs.readFileSync('ci-summary.md', 'utf8');
            } catch (e) {
              // fall back to default message above
            }
            const marker = '<!-- rebyld-ci-summary -->';
            body = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-dist
          rsync -a --exclude='.git' --exclude='pages-dist' --exclude='.github' ./ pages-dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
